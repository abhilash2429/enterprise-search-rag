[project]
name = "entsearch"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "openai",
    "opensearch-py",
    "aws-bedrock-token-generator",
    "tqdm",
    "regex",
    # harness runtime deps
    "pydantic[email]",
    "tiktoken",
    "anthropic",
    "pyyaml",
    "python-dotenv",
    "qdrant-client",
    "torch>=2.11.0",
    "sentence-transformers>=6.1.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
]

[dependency-groups]
dev = [
    "pytest",
    "bm25s",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
